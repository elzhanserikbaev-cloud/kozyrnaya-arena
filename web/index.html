<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Козырная Арена</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: 3D table fills the stage; top HUD, shop rail along the bottom, hand/info/log column on the right. */
:root{
  --ink:#120d19; --panel:#17111f; --panel-2:#1e1629; --line:#4a3b63; --line-soft:#30263f;
  --brass:#e4ae50; --brass-lo:#9a7230; --cream:#f6eddb; --card-ink:#241e2f; --suit-red:#c33a50;
  --txt:#efe6f6; --mute:#a798bc; --hp:#52c88e; --hp-foe:#ee6175; --mana:#5fa1f3; --shield:#e9eef7; --good:#71d8a2; --bad:#f26a7d; --poison:#9be15d;
  --t1:#8c879a; --t2:#4aa96a; --t3:#4b8ce0; --t4:#b25ddf; --t5:#e4ae50;
  --f-display:'Unbounded','Segoe UI Black','Arial Black',system-ui,sans-serif;
  --f-body:'Rubik','Segoe UI',system-ui,sans-serif;
  --side:320px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--txt);font-family:var(--f-body);font-size:14px;line-height:1.4;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-rows:auto minmax(0,1fr) auto;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.muted{color:var(--mute)} .small{font-size:12px}

#top{grid-column:1/-1;display:flex;align-items:center;gap:12px 22px;flex-wrap:wrap;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,#1f162c,#140f1c);border-bottom:1px solid var(--line-soft);z-index:5}
.brand{font-family:var(--f-display);font-weight:900;font-size:17px;line-height:1;color:var(--brass)}
.brand span{display:block;font-size:9.5px;font-weight:500;color:var(--mute);letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
.round{font-family:var(--f-display);font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.round b{color:var(--txt);font-size:20px;margin-left:4px}
.hpbox{display:flex;align-items:center;gap:8px;flex:1 1 160px;max-width:280px}
.hpbox .who{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.hpbox .bar{flex:1;height:9px;border-radius:5px;background:#0008;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff10}
.hpbox .bar i{display:block;height:100%;background:linear-gradient(90deg,#3aa774,var(--hp));transition:width .6s}
.hpbox.foe .bar i{background:linear-gradient(90deg,#c4465a,var(--hp-foe))}
.hpbox b{font-family:var(--f-display);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.topbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{font-size:11px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute);white-space:nowrap}
.ibtn{border:1px solid var(--line);background:#ffffff08;border-radius:9px;padding:6px 10px;font-size:12px}
.ibtn:hover{border-color:var(--brass-lo);background:#ffffff12}
#sideToggle{display:none}

#stage{position:relative;grid-column:1;grid-row:2;min-height:0;min-width:0;overflow:hidden;background:#0b0811}
#c{width:100%;height:100%;display:block;outline:none;touch-action:none}
#ov3d{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.anc{position:absolute;left:0;top:0;will-change:transform}
.stepc{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;
  padding:6px 14px;border-radius:99px;background:#120d19cc;border:1px solid var(--brass-lo);color:var(--brass)}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mute);background:#120d19b0;padding:5px 12px;border-radius:99px;white-space:nowrap}

.htag{transform:translate(0,-50%);display:flex;flex-direction:column;gap:2px;min-width:150px}
.htag .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.htag b{font-family:var(--f-display);font-size:17px;color:var(--brass);text-shadow:0 2px 10px #000}
.htag span{font-size:11.5px;color:#d9cfe6;text-shadow:0 1px 4px #000}
.htag.foe b{color:#f3a0ad}

.ubar{transform:translate(-50%,-100%);width:84px;display:flex;flex-direction:column;gap:2px;padding-bottom:4px;transition:opacity .4s}
.ubar .sh{height:3px;border-radius:2px;overflow:hidden}
.ubar .sh i{display:block;height:100%;width:0;background:var(--shield);transition:width .2s}
.ubar .hp{position:relative;height:12px;border-radius:4px;background:#1a1322e6;overflow:hidden;box-shadow:0 0 0 1px #000a}
.ubar .hp i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(180deg,#6be0a5,#3aa774);transition:width .25s}
.ubar.e .hp i{background:linear-gradient(180deg,#ff8396,#c4465a)}
.ubar .hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.ubar .mp{height:4px;border-radius:2px;background:#0009;overflow:hidden}
.ubar .mp i{display:block;height:100%;width:0;background:var(--mana);transition:width .2s}
.ubar.full .mp i{background:#9cc8ff;box-shadow:0 0 6px #9cc8ff}
.ubar .stun{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:16px;display:none}
.ubar.stunned .stun{display:block}
.ubar.dead{opacity:0}

.fl{transform:translate(-50%,-50%)}
.fl span{display:block;white-space:nowrap;font-family:var(--f-display);font-weight:900;font-size:20px;color:#fff;
  text-shadow:0 0 4px #000,0 2px 0 #000;animation:flUp 1s ease-out forwards}
.fl .crit{color:var(--brass);font-size:27px}
.fl .heal{color:var(--good)} .fl .shield{color:var(--shield)} .fl .poison{color:var(--poison)}
.fl .skill{font-family:var(--f-body);font-weight:700;font-size:15px;color:#ffe1a3;background:#1b1325d9;border:1px solid var(--brass-lo);padding:2px 9px;border-radius:99px;text-shadow:none}
.fl .info,.fl .buff{font-family:var(--f-body);font-weight:700;font-size:13px;color:#cfe0ff}
@keyframes flUp{0%{opacity:0;transform:translateY(10px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

/* shop rail */
#shopbar{grid-column:1;grid-row:3;display:grid;grid-template-columns:210px 260px minmax(0,1fr);gap:18px;align-items:center;
  padding:12px 18px 14px max(18px,env(safe-area-inset-left,0px));background:linear-gradient(0deg,#120d19,#1c1427);border-top:1px solid var(--line-soft);z-index:4}
.econ{display:flex;flex-direction:column;gap:8px}
.gold{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a8,var(--brass) 55%,var(--brass-lo));box-shadow:0 0 0 2px #0005 inset,0 0 12px #e4ae5055}
.interest{font-size:11px;color:var(--mute);font-family:var(--f-body);font-weight:400}
.lvl{font-size:12px;color:var(--mute)}
.lvl b{color:var(--txt);font-family:var(--f-display)}
.xpbar{height:6px;border-radius:3px;background:#0008;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--mana);transition:width .3s}
.odds{display:flex;gap:7px;font-size:11px;font-variant-numeric:tabular-nums;color:var(--mute)}
.odds span{display:flex;align-items:center;gap:3px}
.odds span::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{border:1px solid var(--line);background:#ffffff08;border-radius:10px;padding:8px 10px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:#ffffff14;border-color:var(--brass-lo)}
.btn .pr{font-family:var(--f-display);font-size:11px;color:var(--brass)}
.btn.on{border-color:var(--brass);color:var(--brass)}
.fightbtn{grid-column:1/-1;justify-content:center;background:linear-gradient(180deg,#f3c873,var(--brass));color:#2a1a05;border:none;font-family:var(--f-display);
  font-weight:900;font-size:15px;padding:12px;letter-spacing:.04em;box-shadow:0 3px 0 var(--brass-lo),0 0 24px #e4ae5033}
.fightbtn:hover:not(:disabled){filter:brightness(1.08)}
.shop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto repeat(2,minmax(0,1fr));gap:12px;max-width:900px;min-width:0}
.buy{position:relative;background:none;border:none;padding:0;display:block;min-width:0;transition:transform .15s}
.buy img{display:block;width:100%;aspect-ratio:5/7;filter:drop-shadow(0 6px 10px #000a)}
.buy:hover:not(:disabled){transform:translateY(-6px) rotate(-1deg)}
.buy .price{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:#120d19;border:1px solid var(--brass-lo);
  border-radius:99px;padding:1px 8px 1px 4px;font-family:var(--f-display);font-size:12px;font-weight:700}
.buy .price .coin{width:13px;height:13px}
.buy.poor img{filter:saturate(.25) brightness(.6)}
.shop .sep{width:1px;background:var(--line);align-self:stretch;margin-inline:2px}
#hand{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3;max-width:46%}
#hand .hl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
#hand .hl b{color:var(--brass);letter-spacing:.04em}
#hand .mrow{display:flex;gap:8px;flex-wrap:wrap}
#hand .empty{font-size:12px;color:var(--mute);max-width:230px;line-height:1.35}
.mc{position:relative;width:78px;background:none;border:none;padding:0;transition:transform .15s}
.mc img{display:block;width:100%;aspect-ratio:5/7;filter:drop-shadow(0 6px 10px #000b);border-radius:8px}
.mc:hover:not(:disabled){transform:translateY(-4px) scale(1.04)}
.mc.on{transform:translateY(8px) scale(1.08)}
.mc.on img{outline:3px solid var(--brass);outline-offset:2px}
.mc.dim img{filter:saturate(.15) brightness(.45)}
.banner{position:absolute;left:50%;top:40%;font-family:var(--f-display);font-weight:900;font-size:34px;color:#fff;white-space:nowrap;pointer-events:none;z-index:4;
  text-shadow:0 0 26px var(--c),0 3px 0 #000;animation:ban 1.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.hint.warn{border:1px solid var(--brass);color:var(--brass);top:58px;background:#120d19e6}
.roomcode{font-family:var(--f-display);font-weight:900;font-size:44px;letter-spacing:.18em;color:var(--brass);line-height:1;-webkit-user-select:all;user-select:all}
.coderow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.linkbtn{background:none;border:none;padding:0;color:var(--brass);text-decoration:underline;text-underline-offset:3px;font-size:13px;align-self:flex-start}
#room{text-transform:uppercase;letter-spacing:.12em;max-width:220px}
.sect{margin:0;font-family:var(--f-display);font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.netbox{display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line-soft);padding-top:14px}
.netrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.netrow label{font-size:12px;color:var(--mute);min-width:80px}
.netrow input{flex:1;min-width:170px;background:#0007;border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--txt);font:inherit;-webkit-user-select:text;user-select:text}
.netrow input:focus{outline:2px solid var(--brass);outline-offset:1px}
.ovcard code{font-family:Consolas,'Cascadia Mono',monospace;background:#0007;padding:2px 8px;border-radius:6px;color:var(--brass);-webkit-user-select:all;user-select:all}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 64px 58px 12px;gap:8px;align-items:center;font-size:12.5px}
.pl .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pb{height:6px;border-radius:3px;background:#0008;overflow:hidden}
.pl .pb i{display:block;height:100%;background:var(--hp)}
.pl b{font-family:var(--f-display);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.pl.me .pn{color:var(--brass)}
.pl.out{opacity:.45}
.pl .rd{color:var(--good);font-weight:700}
.plist.big .pl{grid-template-columns:1fr auto;font-size:14px;padding:9px 12px;border:1px solid var(--line-soft);border-radius:10px;background:#ffffff06}
.btns3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sold{aspect-ratio:5/7;border-radius:10px;border:1.5px dashed var(--line-soft);display:grid;place-items:center;color:var(--line);font-size:10px;text-transform:uppercase;letter-spacing:.14em}

/* side */
#side{grid-column:2;grid-row:2/4;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border-left:1px solid var(--line-soft);-webkit-user-select:text;user-select:text}
.panel{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px}
.panel h3{margin:0;font-family:var(--f-display);font-size:10.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.panel p{margin:0}
.bighand{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--brass);line-height:1.1}
.handcards{display:flex;gap:4px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:38px;padding:0 4px;border-radius:5px;background:var(--cream);color:var(--card-ink);font-family:var(--f-display);font-weight:700;font-size:13px;box-shadow:0 2px 0 #0006}
.mini.red{color:var(--suit-red)}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.trait{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:10px;border:1px solid var(--line-soft);font-size:11.5px;line-height:1.25}
.trait .ts{font-size:20px;line-height:1;color:#cfc6dc}
.trait .ts.red{color:#e0697c}
.trait b{display:block;font-size:12px}
.trait .cnt{font-family:var(--f-display);font-size:10px;color:var(--mute)}
.trait.lv1{border-color:var(--brass-lo);background:#e4ae500d}
.trait.lv2{border-color:var(--brass);background:#e4ae501f}
.trait .eff{color:var(--mute)}
.trait.lv1 .eff,.trait.lv2 .eff{color:var(--txt)}
.info-head{display:flex;gap:10px;align-items:center}
.info-head img{width:58px;border-radius:5px}
.info-head b{font-size:15px}
.info-stats{display:flex;gap:12px;font-variant-numeric:tabular-nums;font-weight:500}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto;font-size:12px}
.log li{padding:3px 0;border-bottom:1px solid #ffffff08;color:var(--mute)}
.log li.p{color:#bfe9d2}.log li.e{color:#f3bcc6}.log li.sys{color:var(--brass)}
details.panel summary{cursor:pointer;font-family:var(--f-display);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);list-style:none}
details.panel summary::after{content:' +'}
details[open].panel summary::after{content:' −'}
.legend{width:100%;border-collapse:collapse;font-size:12px}
.legend td{padding:5px 0;border-bottom:1px solid #ffffff0a;vertical-align:top}
.legend td:first-child{font-weight:700;padding-right:8px;white-space:nowrap}
.legend td:last-child{color:var(--mute)}
.legend tr.cur td{color:var(--brass)}

@media (max-width:1150px){
  body{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;right:0;top:58px;bottom:0;width:min(330px,92vw);transform:translateX(105%);transition:transform .25s;z-index:30;box-shadow:-20px 0 40px #0009}
  body.side-open #side{transform:none}
  #sideToggle{display:block}
  #shopbar{grid-template-columns:200px minmax(0,1fr)}
  .shop{grid-column:1/-1;max-width:none}
}

/* overlays */
#overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at center,#120d1999,#0a0710ee);padding:20px;overflow:auto}
#overlay.soft{background:#0a071066}
.ovcard{background:linear-gradient(170deg,#2d2140f2,#1b1426f2);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,36px);max-width:580px;width:100%;
  box-shadow:0 30px 80px #000c;display:flex;flex-direction:column;gap:14px;-webkit-user-select:text;user-select:text}
.ovsuits{font-size:26px;letter-spacing:.3em;color:var(--mute)}
.ovsuits .r{color:#e0697c}
.ovcard h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5vw,44px);line-height:1;color:var(--brass);text-wrap:balance}
.ovcard h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1.1;text-wrap:balance}
.ovcard p{margin:0;max-width:62ch}
.ovcard ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;color:var(--mute)}
.ovcard ul b{color:var(--txt)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diffs button{border:1px solid var(--line);background:#ffffff08;border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.diffs button b{font-family:var(--f-display);font-size:13px}
.diffs button span{font-size:11px;color:var(--mute)}
.diffs button:hover{border-color:var(--brass);background:#e4ae5014}
.cont{border:1px solid var(--brass);background:#e4ae5018;color:var(--brass);border-radius:12px;padding:12px;font-family:var(--f-display);font-weight:700}
.win h2{color:var(--good)} .lose h2{color:var(--bad)} .draw h2{color:var(--mute)}
.dmgline{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:#2b2039f0;border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px #0008;animation:tIn .2s ease-out;text-align:center}
.toast.bad{border-color:#8a3a4a}.toast.good{border-color:var(--brass)}
@keyframes tIn{from{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<header id="top"></header>
<main id="stage"><canvas id="c" aria-label="Игровой стол"></canvas><div id="ov3d"></div><div id="hand"></div></main>
<aside id="side"></aside>
<footer id="shopbar"></footer>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script src="babylon.js"></script>
<script src="peerjs.min.js"></script>
<script>
'use strict';
/* =========================================================
   ДАННЫЕ
   ========================================================= */
const SUITS={
  S:{sym:'♠',name:'Пики',trait:'Клинки',red:false,t2:'+20% к шансу крита',t4:'+45% к шансу крита'},
  H:{sym:'♥',name:'Черви',trait:'Сердца',red:true,t2:'отряд лечит 2,5% ОЗ за ход',t4:'отряд лечит 6% ОЗ за ход'},
  D:{sym:'♦',name:'Бубны',trait:'Грани',red:true,t2:'щит 15% ОЗ на старте',t4:'щит 35% ОЗ на старте'},
  C:{sym:'♣',name:'Трефы',trait:'Чаща',red:false,t2:'+15% ОЗ отряду',t4:'+35% ОЗ и +15% АТК'},
};
const SUITCOL={S:'#b39cff',H:'#ff7d9a',D:'#ffc35c',C:'#8fe37e'};
const RAW=[
 ['dog','Пёс-Рыцарь','🐕','C',2,1,650,45,60,'shield',2.5,'Верная стойка'],

function evalHand(cards){
  const n=cards.length; if(!n) return 'high';
  const cnt={}; cards.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
  const v=Object.values(cnt).sort((a,b)=>b-a);
  const flush=n===5&&cards.every(c=>c.s===cards[0].s);
  let straight=false;
  if(n===5&&v[0]===1){
    const rs=cards.map(c=>c.r).sort((a,b)=>a-b);
    straight=rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14';
    if(straight&&flush) return rs[0]===10?'royal':'sflush';
  }
  if(v[0]===4) return 'four';
  if(v[0]===3&&v[1]===2) return 'full';
  if(flush) return 'flush';
  if(straight) return 'straight';
  if(v[0]===3) return 'three';
  if(v[0]===2&&v[1]===2) return 'two';
  if(v[0]===2) return 'pair';
  return 'high';
}
function traitLevels(list){
  const n={S:0,H:0,D:0,C:0}; list.forEach(u=>n[DEF[u.id].s]++);
  const lv={}; for(const k in n) lv[k]=n[k]>=4?2:n[k]>=2?1:0;
  return {n,lv};
}
// Джокер: перебираем все ранги и масти для карт с джокером и берём лучшую руку
function evalUnits(units){
  const cards=units.map(u=>({r:DEF[u.id].r,s:DEF[u.id].s,j:(u.items||[]).includes('joker')}));
  const js=cards.filter(c=>c.j).slice(0,2);
  if(!js.length) return evalHand(cards);
  let best='high';
  const rec=i=>{
    if(i===js.length){const h=evalHand(cards);if(HAND_ORDER.indexOf(h)>HAND_ORDER.indexOf(best))best=h;return;}
    for(let r=2;r<=14;r++) for(const s of 'SHDC'){js[i].r=r;js[i].s=s;rec(i+1);}
  };
  rec(0);return best;
}
function teamInfo(units){return {hand:evalUnits(units),tl:traitLevels(units)};}
function handText(k){

  if(h.mana)p.push(h.mana>=1?'полная мана на старте':`старт с ${R(h.mana*100)}% маны`);

}
function addXp(side,n){

  while(side.level<8&&side.xp>=XPNEED[side.level]){side.xp-=XPNEED[side.level];side.level++;}
  if(side.level>=8) side.xp=0;
}
function rollId(level){
  const o=ODDS[level]; let x=Math.random()*100, c=0;
  for(;c<5;c++){x-=o[c]; if(x<0) break;}
  const cost=Math.min(c,4)+1, pool=CHARS.filter(d=>d.c===cost);
  return pool[Math.floor(Math.random()*pool.length)].id;
}
const rollShop=level=>Array.from({length:5},()=>rollId(level));
function mergeAll(side){
  let merged=null, changed=true;
  while(changed){
    changed=false;
    for(const star of [1,2]){
      const g={};
      side.board.forEach((u,i)=>{if(u&&u.star===star)(g[u.id]??=[]).push({z:'board',i,u})});
      side.bench.forEach((u,i)=>{if(u&&u.star===star)(g[u.id]??=[]).push({z:'bench',i,u})});
      for(const id in g){
        if(g[id].length>=3){
          const [keep,a,b]=g[id];
          const its=[...(keep.u.items||[]),...(a.u.items||[]),...(b.u.items||[])];
          keep.u.items=its.slice(0,2);
          its.slice(2).forEach(k=>{if(side.hand&&side.hand.length<5)side.hand.push(k);else side.gold+=MAGIC[k].c;});
          keep.u.star++; side[a.z][a.i]=null; side[b.z][b.i]=null;
          merged=keep.u; changed=true; break;
        }
      }
      if(changed) break;
    }
  }
  if(side.bench.length>6){
    const extra=side.bench.splice(6);
    extra.filter(Boolean).forEach(u=>{const k=side.bench.indexOf(null); if(k>=0) side.bench[k]=u;});
  }
  return merged;
}
function gainUnit(side,unit){
  const k=side.bench.indexOf(null);
  if(k>=0){side.bench[k]=unit; return {ok:true,merged:mergeAll(side)};}
  const same=allUnits(side).filter(u=>u.id===unit.id&&u.star===1).length;
  if(same>=2){side.bench.push(unit); return {ok:true,merged:mergeAll(side)};}
  return {ok:false};
}

/* ---------- соперник ---------- */
function* combos(arr,k,start=0,acc=[]){
  if(acc.length===k){yield acc.slice();return;}
  for(let i=start;i<arr.length;i++){acc.push(arr[i]);yield* combos(arr,k,i+1,acc);acc.pop();}
}
function aiArrange(side){
  const all=allUnits(side).sort((a,b)=>power(b)-power(a));
  const cap=capOf(side.level), k=Math.min(cap,all.length);
  const cand=all.slice(0,Math.min(all.length,cap+3));
  let best=all.slice(0,k), bestScore=-1;
  for(const set of combos(cand,k)){
    const {hand,tl}=teamInfo(set), H=HANDS[hand];
    let sc=set.reduce((s,u)=>s+power(u),0)*(1+(H.atk+H.hp)/2+H.mana*.15);
    for(const s in tl.lv) sc*=1+tl.lv[s]*.06;
    if(sc>bestScore){bestScore=sc;best=set;}
  }
  const rest=all.filter(u=>!best.includes(u));
  side.board=Array(5).fill(null); side.bench=Array(6).fill(null);
  const tanky=best.slice().sort((a,b)=>stats(b).hp-stats(a).hp);
  [2,1,3,0,4].slice(0,tanky.length).forEach((lane,i)=>side.board[lane]=tanky[i]);
  rest.forEach((u,i)=>{if(i<6) side.bench[i]=u; else side.gold+=sellValue(u);});
}
function aiTurn(side){
  const target=[0,1,2,3,3,4,4,5,5,5,6,6,6,7,7,7,8][Math.min(S.round,16)];
  while(side.level<target&&side.level<8&&side.gold>=4){side.gold-=4;addXp(side,4);}
  const shopOnce=()=>{
    rollShop(side.level).forEach(id=>{
      const d=DEF[id]; if(side.gold<d.c) return;
      const owned=allUnits(side).filter(u=>u.id===id&&u.star<3).length;
      const want=owned>0||allUnits(side).length<capOf(side.level)+2||d.c>=Math.min(5,side.level-1);
      if(!want) return;
      let r=gainUnit(side,mkUnit(id));
      if(!r.ok){
        let w=-1; side.bench.forEach((u,i)=>{if(u&&(w<0||power(u)<power(side.bench[w])))w=i;});
        if(w<0||power(side.bench[w])>=power({id,star:1})) return;
        side.gold+=sellValue(side.bench[w]); side.bench[w]=null;
        r=gainUnit(side,mkUnit(id));
      }
      if(r.ok) side.gold-=d.c;
    });
  };
  shopOnce();
  const keep=S.diff==='hard'?14:S.round>=10?20:30;
  let rolls=0;
  if(S.diff!=='easy') while(side.gold>=keep+2&&rolls<8){side.gold-=2;rolls++;shopOnce();}
  aiArrange(side);
  aiMagic(side);
}
function aiMagic(side){
  if(S.round<2||(S.diff==='easy'&&S.round%2)) return;
  for(const k of [rollMagic(),rollMagic()]){
    const M=MAGIC[k];
    if(side.gold<M.c+(S.round<6?0:8)) continue;
    if(M.k==='spell'&&side.hand.length>=2) continue;
    if(M.k==='item'){
      const tgt=side.board.filter(u=>u&&(u.items||[]).length<2).sort((a,b)=>power(b)-power(a))[0];
      if(!tgt) continue;
      (tgt.items=tgt.items||[]).push(k);
    } else side.hand.push(k);
    side.gold-=M.c; break;
  }
}

function ac(){

  if(AUD.ctx.state==='suspended') AUD.ctx.resume();

}
function tone(f,dur,type='sine',vol=.12,slide=null,delay=0){
  const a=ac(); if(!a) return; const t=a.currentTime+delay;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.03);
}
function noise(dur,vol=.18,freq=1200,delay=0){
  const a=ac(); if(!a) return;
  if(!AUD.nbuf){AUD.nbuf=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=AUD.nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const t=a.currentTime+delay, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=AUD.nbuf; f.type='lowpass'; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur+.02);
}
function sfx(k){

  const now=performance.now(); if(AUD.last[k]&&now-AUD.last[k]<55) return; AUD.last[k]=now;
  switch(k){
    case 'place': noise(.07,.22,900); tone(170,.09,'triangle',.1); break;
    case 'pick': tone(540,.06,'triangle',.06); break;
    case 'buy': tone(880,.07,'square',.04); tone(1320,.12,'square',.04,null,.06); break;
    case 'sell': tone(660,.12,'triangle',.08,330); break;
    case 'reroll': noise(.22,.1,3200); tone(400,.15,'triangle',.04,800); break;

    case 'crit': noise(.13,.24,2600); tone(320,.16,'sawtooth',.05,90); break;
    case 'cast': tone(300,.35,'sine',.08,900); tone(450,.35,'triangle',.04,1350); break;
    case 'heal': tone(990,.25,'sine',.05); tone(1480,.3,'sine',.035,null,.05); break;
    case 'death': tone(240,.45,'sawtooth',.05,55); break;
    case 'merge': [523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.07,null,i*.07)); break;

function sync3D(o={}){
  const want=new Map();
  S.p.board.forEach((u,i)=>u&&want.set(u.uid,{u,pos:POS.board(i),s:1}));
  S.p.bench.forEach((u,i)=>u&&want.set(u.uid,{u,pos:POS.bench(i),s:.86}));
  S.ai.board.forEach((u,i)=>u&&want.set(u.uid,{u,pos:POS.eboard(i),s:1,foe:true}));
  const mergeNode=o.mergeInto!=null?nodes.get(o.mergeInto):null;
  for(const [uid,n] of [...nodes]){
    if(want.has(uid)) continue;
    nodes.delete(uid);
    const to=mergeNode?mergeNode.root.position.clone():n.root.position.add(new V3(0,1.6,-1.2));
    const from=n.root.position.clone(),s0=n.root.scaling.x;n.tok++;
    tween(360,k=>{V3.LerpToRef(from,to,k,n.root.position);n.root.position.y+=Math.sin(k*Math.PI)*.6;n.root.scaling.setAll(s0*(1-k*.8));},easeInOut).then(()=>disposeNode(n));
  }
  for(const [uid,w] of want){
    let n=nodes.get(uid),fresh=false;
    if(!n){
      n=makeNode(w.u);fresh=true;
      const sp=o.spawnUid===uid&&o.spawn?o.spawn:new V3(w.pos.x,2.6,w.foe?7.5:-7.5);
      n.root.position.copyFrom(sp);n.root.scaling.setAll(w.s);
    }
    const key=w.u.star+'|'+(w.u.items||[]).join(',');
    if(n.key!==key){
      const up=n.star!==w.u.star;
      n.star=w.u.star;n.key=key;n.face.material=faceMat(n.id,n.star,w.u.items||[]);
      if(up) setTimeout(()=>{burst(w.pos.add(new V3(0,.4,0)),'#ffd36b',90,2.6,{g:-2,life:.9});flashHalo(n,'#ffd36b',900);},360);
    }
    if(S.phase!=='result') resetAnim(n);
    if(dragging&&dragging.uid===uid) continue;
    moveNode(n,w.pos,w.s,fresh?560:300);
  }

}

      const M=MAGIC[S.p.hand[S.targeting]],side=M.t==='foe'?'e':'p';
      const c=S.teams[side].find(c=>c&&c.alive&&c.u.uid===m.uid);
      if(c) playSpell(S.targeting,c); else toast(M.t==='foe'?'Выберите живую карту соперника':'Выберите свою живую карту','bad');
    }
    return;
  }
  if(S.phase!=='shop') return;
  if(S.useMagic!=null){
    let loc=null;
    if(m&&m.uid) loc=locOfUid(m.uid);
    else if(m&&m.slot&&(m.slot.z==='board'||m.slot.z==='bench')&&getAt(S.p,m.slot)) loc={z:m.slot.z,i:m.slot.i};
    if(loc) applyItem(loc); else {S.useMagic=null;render();}
    return;
  }
  if(!m){if(S.sel){S.sel=null;render();}return;}
  if(m.uid){const loc=locOfUid(m.uid); if(loc) onSlot(loc); return;}
  if(m.slot){
    const s=m.slot;
    if(s.z==='sell'){if(S.sel) sell(S.sel);}
    else if(s.z==='board'||s.z==='bench') onSlot({z:s.z,i:s.i});
    else if(S.sel){S.sel=null;render();}
  }
}

function newGame(diff,showStart=false,net=false){
  clearNodes();clearBars();uidc=1;
  S={mode:net?'net':'solo',round:1,phase:'shop',diff,speed:2,p:newSide(),ai:newSide(),shop:[],locked:false,sel:null,info:null,log:[],teams:null,result:null,showStart,step:0,income:null,magicShop:[],useMagic:null,targeting:null,spellsUsed:0};
  beginRound(true);
}
function beginRound(first){
  for(const [side,isAi] of (S.mode==='net'?[[S.p,false]]:[[S.p,false],[S.ai,true]])){
    if(first){side.gold=6;continue;}
    const interest=Math.min(5,Math.floor(side.gold/10));
    const st=Math.abs(side.streak),sb=st>=3?2:st>=2?1:0;
    const lv=side.level;
    side.gold+=Math.max(0,5+interest+sb+(isAi?AIBONUS[S.diff]:0));
    addXp(side,2);
    if(!isAi){S.income={interest,sb};if(side.level>lv)S.levelUp=true;}
  }
  if(first||!S.locked){S.shop=rollShop(S.p.level);S.magicShop=[rollMagic(),rollMagic()];}
  S.locked=false;S.phase='shop';S.sel=null;S.teams=null;S.result=null;S.step=0;
  clearBars();
  render();
  if(!first&&S.income){const {interest,sb}=S.income;toast(`+${5+interest+sb} золота: 5 за раунд${interest?`, ${interest} процентов`:''}${sb?`, ${sb} за серию`:''}`);}
  if(S.levelUp){S.levelUp=false;toast(`Уровень ${S.p.level}: на поле до ${capOf(S.p.level)} карт`,'good');sfx('level');}
}
function buy(i){
  if(S.phase!=='shop') return;
  const id=S.shop[i]; if(!id) return;
  const d=DEF[id];
  if(S.p.gold<d.c){toast('Не хватает золота','bad');return;}
  const u=mkUnit(id),r=gainUnit(S.p,u);
  if(!r.ok){toast('Скамья заполнена. Продайте карту или выставьте её на поле.','bad');return;}
  S.p.gold-=d.c;S.shop[i]=null;S.sel=null;sfx('buy');
  if(r.merged){S.info={id:r.merged.id,star:r.merged.star};toast(`${DEF[r.merged.id].n} теперь ${'★'.repeat(r.merged.star)}`,'good');setTimeout(()=>sfx('merge'),300);}
  render({spawnUid:u.uid,spawn:new V3(-2.4+i*1.2,2.4,-7.2),mergeInto:r.merged?r.merged.uid:null});
}
function buyMagic(i){
  if(S.phase!=='shop') return;
  const k=S.magicShop[i]; if(!k) return;
  const M=MAGIC[k];
  if(S.p.gold<M.c){toast('Не хватает золота','bad');return;}
  if(S.p.hand.length>=5){toast('В руке магии помещается 5 карт','bad');return;}
  S.p.gold-=M.c;S.p.hand.push(k);S.magicShop[i]=null;S.info={magic:k};sfx('buy');
  toast(M.k==='item'?`«${M.n}» в руке. Нажмите на неё, потом на героя`:`«${M.n}» в руке. Разыграйте во время боя`,'good');
  render();
}
function onMagic(i){
  const k=S.p.hand[i]; if(!k) return;
  const M=MAGIC[k];
  if(S.phase==='shop'){
    S.info={magic:k};
    if(M.k==='item'){S.useMagic=S.useMagic===i?null:i;S.sel=null;render();}
    else{renderInfo();toast('Заклинание разыгрывается во время боя: нажмите на него в руке, когда начнётся бой');}
    return;
  }
  if(S.phase!=='battle'||!S.teams) return;
  if(M.k==='item'){toast('Усиления выдаются героям между боями');return;}
  if(S.spellsUsed>=2){toast('За один бой можно разыграть 2 заклинания','bad');return;}
  if(M.t){S.targeting=S.targeting===i?null:i;renderHand();renderStage();return;}
  playSpell(i,null);
}
function playSpell(i,t){
  const k=S.p.hand[i];S.p.hand.splice(i,1);S.spellsUsed++;S.targeting=null;
  renderHand();renderStage();
  if(S.mode==='net'){
    // по сети заклинание срабатывает в начале следующего хода у обоих игроков одновременно
    const me=S.home?'home':'away',them=S.home?'away':'home';
    S.pendingSpells.push({k,caster:me,tside:t?(t.side==='p'?me:them):me,lane:t?t.lane:0});
    toast(`«${MAGIC[k].n}» сработает в начале следующего хода`,'good');
    return;
  }
  castSpell('p',k,t);
}
function applyItem(loc){
  const i=S.useMagic,k=S.p.hand[i],u=getAt(S.p,loc);
  if(!u||!k) return;
  u.items=u.items||[];
  if(u.items.length>=2){toast('У героя уже 2 усиления','bad');return;}
  u.items.push(k);S.p.hand.splice(i,1);S.useMagic=null;S.info={id:u.id,star:u.star,items:u.items};
  const n=nodes.get(u.uid);if(n){burst(n.root.position.add(new V3(0,.4,0)),'#46c9bd',70,2.2,{g:-2});flashHalo(n,'#46c9bd',800);}
  sfx('merge');toast(`${DEF[u.id].n} получает «${MAGIC[k].n}»`,'good');render();
}
function moveUnit(from,to){
  const p=S.p,a=getAt(p,from),b=getAt(p,to);
  S.sel=null;
  if(!a||locEq(from,to)){render();return;}
  if(to.z==='board'&&from.z==='bench'&&!b&&boardCount(p)>=capOf(p.level)){
    toast(`На поле сейчас помещается ${capOf(p.level)} карт. Поднимите уровень, чтобы ставить больше.`,'bad');render();return;
  }
  p[from.z][from.i]=b;p[to.z][to.i]=a;sfx('place');render();
}
function sell(loc){
  const u=getAt(S.p,loc); if(!u) return;
  const v=sellValue(u);S.p.gold+=v;S.p[loc.z][loc.i]=null;S.sel=null;
  (u.items||[]).forEach(k=>{if(S.p.hand.length<5)S.p.hand.push(k);else S.p.gold+=MAGIC[k].c;});
  const n=nodes.get(u.uid); if(n) burst(POS.sell().add(new V3(0,.4,0)),'#e4ae50',40,1.8,{g:-3});
  sfx('sell');toast(`${DEF[u.id].n} продан за ${v}`);render();
}
function onSlot(loc){
  if(S.phase!=='shop') return;
  const u=getAt(S.p,loc);
  if(S.sel){if(locEq(S.sel,loc)) S.sel=null; else return moveUnit(S.sel,loc);}
  else if(u){S.sel=loc;S.info={id:u.id,star:u.star};sfx('pick');}
  render();
}
async function fight(){
  if(S.phase!=='shop') return;
  if(S.mode==='net'){netReady();return;}
  S.phase='battle';S.sel=null;S.log=[];
  aiTurn(S.ai);
  sfx('start');
  const res=await simulate();
  resolve(res);
}
function resolve(res){
  const base=1+Math.floor(S.round/3);
  const surv=t=>t.filter(c=>c&&c.alive).reduce((s,c)=>s+c.u.star+(c.d.c>=4?1:0),0);
  let outcome='draw',dmgP=0,dmgE=0;
  if(res.pa&&!res.ea){outcome='win';dmgE=base+surv(res.A);}
  else if(!res.pa&&res.ea){outcome='lose';dmgP=base+surv(res.B);}
  else{dmgP=base;dmgE=base;}
  S.p.hp=Math.max(0,S.p.hp-dmgP);S.ai.hp=Math.max(0,S.ai.hp-dmgE);
  if(outcome==='win'){S.p.streak=S.p.streak>0?S.p.streak+1:1;S.ai.streak=S.ai.streak<0?S.ai.streak-1:-1;}
  else if(outcome==='lose'){S.ai.streak=S.ai.streak>0?S.ai.streak+1:1;S.p.streak=S.p.streak<0?S.p.streak-1:-1;}
  else{S.p.streak=0;S.ai.streak=0;}
  let over=null;
  if(S.mode!=='net'&&(S.p.hp<=0||S.ai.hp<=0)) over=S.p.hp>S.ai.hp?'win':S.p.hp<S.ai.hp?'lose':'draw';
  S.result={outcome,dmgP,dmgE,over,out:S.mode==='net'&&S.p.hp<=0};S.phase='result';S.targeting=null;
  if(S.mode==='net'){
    S.rng=null;
    const bot=S.opp&&S.opp.bot;
    sendHost({t:'result',hp:S.p.hp,won:outcome==='win',botId:bot?S.opp.id:null,botDmg:bot?dmgE:0});
  }
  if(S.speed>=50) S.speed=2;
  log(outcome==='win'?`Раунд ваш. Соперник теряет ${dmgE} ОЗ.`:outcome==='lose'?`Раунд проигран. Вы теряете ${dmgP} ОЗ.`:`Ничья. Обе стороны теряют ${base} ОЗ.`,'sys');
  sfx((over||outcome)==='lose'?'lose':(over||outcome)==='win'?'win':'death');
  if(over){try{localStorage.removeItem(SAVE_KEY);}catch(_){}}
  render();
}
function nextRound(){S.round++;beginRound(false);}

/* ---------- бой ---------- */
const sleep=ms=>S.speed>=50?Promise.resolve():new Promise(r=>setTimeout(r,ms/S.speed));
function buildTeam(side,tag){
  const units=side.board.filter(Boolean),{hand,tl}=teamInfo(units),H=HANDS[hand];
  return side.board.map((u,lane)=>{
    if(!u) return null;
    const d=DEF[u.id],st=stats(u),it=u.items||[],cnt=k=>it.filter(x=>x===k).length;
    const maxHp=R(st.hp*(1+H.hp+(tl.lv.C===2?.35:tl.lv.C===1?.15:0)+.3*cnt('armor')));
    const atk=R(st.atk*(1+H.atk+(tl.lv.C===2?.15:0)+.25*cnt('sword')));
    return {u,d,side:tag,lane,maxHp,hp:maxHp,atk,baseAtk:atk,mm:d.mm,mana:R(d.mm*Math.min(1,H.mana+.4*cnt('orb'))),
      lifesteal:.25*cnt('fang'),thorns:.25*cnt('thorns'),
      shield:R(maxHp*(tl.lv.D===2?.35:tl.lv.D===1?.15:0)),crit:.1+(tl.lv.S===2?.45:tl.lv.S===1?.2:0)+.2*cnt('feather'),
      regen:tl.lv.H===2?.06:tl.lv.H===1?.025:0,stun:0,poison:[],alive:true,bar:null};
  });
}
const alive=t=>t.some(c=>c&&c.alive);
const live=t=>t.filter(c=>c&&c.alive);
const adj=(t,l)=>t.filter(c=>c&&c.alive&&Math.abs(c.lane-l)<=1);
const cname=c=>`${c.d.n}${c.u.star>1?' '+'★'.repeat(c.u.star):''}`;
function findTarget(c,foes){
  if(foes[c.lane]&&foes[c.lane].alive) return foes[c.lane];
  let best=null,bd=9;
  for(const f of foes) if(f&&f.alive){const d=Math.abs(f.lane-c.lane);if(d<bd){bd=d;best=f;}}
  return best;
}
function setStep(){const el=$('#stepc'); if(el) el.textContent=`Ход ${S.step}`;}
async function simulate(){
  render();
  const A=buildTeam(S.p,'p'),B=buildTeam(S.ai,'e');
  S.teams={p:A,e:B};S.step=0;S.spellsUsed=0;S.targeting=null;S.useMagic=null;renderHand();
  await sleep(650);
  makeBars();
  [...live(A),...live(B)].forEach(c=>{if(c.shield>0){const n=nodes.get(c.u.uid);flashHalo(n,'#e9eef7',600);}});
  log(`Раунд ${S.round}: ${HANDS[teamInfo(S.p.board.filter(Boolean)).hand].n} против ${HANDS[teamInfo(S.ai.board.filter(Boolean)).hand].n}`,'sys');
  await sleep(500);
  const net=S.mode==='net';
  if(net) await netSync(0);
  // «домашняя» команда ходит первой в нечётные ходы — одинаково на обоих компьютерах
  const H=S.home===false?B:A,W=H===A?B:A;
  while(S.step<30&&alive(A)&&alive(B)){
    S.step++;setStep();
    if(net) await applyQueued();
    if((S.step===2||S.step===5)&&S.ai.hand.length&&(!net||(S.opp&&S.opp.bot))) await aiCast();
    const order=[];
    for(let l=0;l<5;l++){const a=H[l],b=W[l];if(S.step%2){a&&order.push(a);b&&order.push(b);}else{b&&order.push(b);a&&order.push(a);}}
    for(const c of order){if(!alive(A)||!alive(B)) break; if(c.alive) await act(c);}
    endStep(H);endStep(W);
    await sleep(280);
    if(net) await netSync(S.step);
  }
  await sleep(700);
  return {pa:alive(A),ea:alive(B),A,B};
}
async function act(c){
  const allies=S.teams[c.side],foes=S.teams[c.side==='p'?'e':'p'];
  if(c.stun>0){c.stun--;upd(c);float(c,'пропускает ход','info');await sleep(240);return;}
  const t=findTarget(c,foes); if(!t) return;
  if(c.mana>=c.mm){
    c.mana=0;upd(c);float(c,c.d.ab.n,'skill');sfx('cast');
    log(`${cname(c)}: «${c.d.ab.n}»`,c.side);
    await castFx(c);
    await cast(c,t,allies,foes);upd(c);await sleep(300);
  } else {
    lungeFx(c,t);await sleep(125);
    hit(c,t,c.atk,true);
    c.mana=Math.min(c.mm,c.mana+20);upd(c);await sleep(270);
  }
}
function hit(src,t,amt,canCrit=true,cls='dmg'){
  if(!t||!t.alive) return 0;
  let crit=false;
  if(canCrit&&src&&(S.rng||Math.random)()<src.crit){amt*=1.75;crit=true;}
  amt=R(amt);let dmg=amt;
  if(t.shield>0){const a=Math.min(t.shield,dmg);t.shield-=a;dmg-=a;}
  t.hp-=dmg;t.mana=Math.min(t.mm,t.mana+8);
  float(t,`${crit?'крит ':''}−${amt}`,crit?'crit':cls);
  shakeFx(t);const n=nodes.get(t.u.uid);
  if(n){flashHalo(n,cls==='poison'?'#9be15d':'#ff5a6e',260);if(crit)burst(posOf(t),'#ffd36b',36,2.2);}
  sfx(crit?'crit':'hit');
  if(t.hp<=0){t.hp=0;t.alive=false;dieFx(t);sfx('death');log(`${cname(t)} выбывает`,t.side==='p'?'e':'p');}
  upd(t);
  if(src&&src.alive&&src.lifesteal) heal(src,amt*src.lifesteal,false);
  if(src&&src.alive&&t.thorns) hit(null,src,amt*t.thorns,false,'dmg');
  return amt;
}
function heal(c,amt,fx=true){
  if(!c||!c.alive) return 0;
  const real=Math.min(R(amt),c.maxHp-c.hp);
  if(real>0){
    c.hp+=real;float(c,`+${real}`,'heal');upd(c);
    if(fx){const p=posOf(c);if(p)burst(p,'#71d8a2',24,.8,{g:3,life:.9});sfx('heal');}
  }
  return real;
}
function addShield(c,amt){
  if(!c.alive) return;c.shield+=R(amt);float(c,`щит ${R(amt)}`,'shield');upd(c);
  const n=nodes.get(c.u.uid);flashHalo(n,'#cfe0ff',600);const p=posOf(c);if(p)burst(p,'#cfe0ff',22,1,{g:1});
}
async function cast(c,t,allies,foes){
  const {t:type,v}=c.d.ab,P=c.atk*v,col=SUITCOL[c.d.s];
  const shootAll=tg=>Promise.all(tg.map(x=>bolt(c,x,col)));
  switch(type){
    case 'strike': await bolt(c,t,col);hit(c,t,P);break;
    case 'stun': await bolt(c,t,col);hit(c,t,P);if(t.alive){t.stun=1;upd(t);const p=posOf(t);if(p)burst(p,'#ffe66b',30,1.2,{g:0});}break;
    case 'cleave':{const tg=adj(foes,t.lane);await shootAll(tg);tg.forEach(x=>hit(c,x,P));}break;
    case 'volley':{const tg=live(foes);await shootAll(tg);tg.forEach(x=>hit(c,x,P,false));}break;
    case 'heal': heal(live(allies).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0],P);break;
    case 'healall': live(allies).forEach(x=>heal(x,P));break;
    case 'shield': adj(allies,c.lane).forEach(x=>addShield(x,P));break;
    case 'shieldall': live(allies).forEach(x=>addShield(x,P));break;
    case 'rally': live(allies).forEach(x=>{x.atk=R(x.atk+x.baseAtk*v);float(x,`+${R(v*100)}% АТК`,'buff');flashHalo(nodes.get(x.u.uid),'#e4ae50',600);});break;
    case 'drain':{await bolt(c,t,col);const d=hit(c,t,P);heal(c,d);}break;
    case 'execute': await bolt(c,t,col);hit(c,t,t.hp/t.maxHp<.4?P*2:P);break;
    case 'poison':{const tg=adj(foes,t.lane);await Promise.all(tg.map(x=>bolt(c,x,'#9be15d')));
      tg.forEach(x=>{if(!x.alive)return;x.poison.push({d:R(P),n:3});float(x,'яд','poison');const p=posOf(x);if(p)burst(p,'#9be15d',30,.6,{g:.5,life:1});});}break;
    case 'stunall':{const tg=live(foes);await shootAll(tg);camShake(.25);tg.forEach(x=>{hit(c,x,P,false);if(x.alive){x.stun=1;upd(x);}});}break;
    case 'reap':{const tg=live(foes);await shootAll(tg);tg.forEach(x=>hit(c,x,x.hp/x.maxHp<.4?P*2:P,false));}break;
    case 'sunburst':{const tg=live(foes);await shootAll(tg);camShake(.2);tg.forEach(x=>hit(c,x,P,false));live(allies).forEach(x=>heal(x,c.atk));}break;
  }
}
async function aiCast(){
  const i=S.ai.hand.findIndex(k=>MAGIC[k].k==='spell'); if(i<0) return;
  const k=S.ai.hand[i],M=MAGIC[k],A=S.teams.e,F=S.teams.p;
  let t=null;
  if(M.t==='foe') t=live(F).sort((a,b)=>b.atk-a.atk)[0];
  else if(M.t==='ally') t=k==='surge'?live(A).filter(c=>c.mana<c.mm).sort((a,b)=>b.atk-a.atk)[0]:live(A).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
  if(M.t&&!t) return;
  S.ai.hand.splice(i,1);renderTags();
  await castSpell('e',k,t);await sleep(250);
}
function banner(text,col){
  if(S.speed>=50) return;
  const el=document.createElement('div');el.className='banner';el.style.setProperty('--c',col);el.textContent=text;
  $('#stage').appendChild(el);setTimeout(()=>el.remove(),1450);
}
async function castSpell(side,k,t){
  if(!S.teams) return;
  const M=MAGIC[k],allies=S.teams[side],foes=S.teams[side==='p'?'e':'p'];
  if(!alive(allies)||!alive(foes)) return;
  banner(`${side==='p'?'':'Соперник: '}${M.e} ${M.n}`,side==='p'?'#e4ae50':'#ee6175');
  log(`${side==='p'?'Вы разыгрываете':'Соперник разыгрывает'} «${M.n}»`,side);
  sfx('cast');
  const sky=side==='p'?new V3(0,3.6,-6):new V3(0,3.6,6.5);
  switch(k){
    case 'fireball':
      if(!t||!t.alive) return;
      await boltPos(sky,posOf(t),'#ff8a3d');
      if(t.alive){const p=posOf(t);hit(null,t,spellPow(300),false,'crit');if(p)burst(p,'#ff8a3d',90,3,{g:-2});camShake(.2);}
      break;
    case 'heal': if(t&&t.alive){heal(t,t.maxHp*.45);flashHalo(nodes.get(t.u.uid),'#71d8a2',800);} break;
    case 'bless': live(allies).forEach(x=>addShield(x,spellPow(180))); break;
    case 'rage': live(allies).forEach(x=>{x.atk=R(x.atk+x.baseAtk*.3);float(x,'+30% АТК','buff');flashHalo(nodes.get(x.u.uid),'#ff9a3d',800);}); break;
    case 'freeze': live(foes).forEach(x=>{x.stun=Math.max(x.stun,1);upd(x);float(x,'заморожен','info');const p=posOf(x);if(p)burst(p,'#bfe6ff',50,1.5,{g:-1});flashHalo(nodes.get(x.u.uid),'#bfe6ff',900);}); break;
    case 'meteor':{
      const tg=live(foes);
      await Promise.all(tg.map(x=>boltPos(sky.add(new V3((x.lane-2)*1.3,0,0)),posOf(x),'#b39cff')));
      camShake(.25);tg.forEach(x=>hit(null,x,spellPow(140),false));
    } break;
    case 'surge': if(t&&t.alive){t.mana=t.mm;upd(t);float(t,'полная мана','buff');const p=posOf(t);if(p)burst(p,'#5fa1f3',60,1.6,{g:2});} break;
  }
}
function endStep(team){
  for(const c of team){
    if(!c||!c.alive) continue;
    if(c.poison.length){
      const sum=c.poison.reduce((s,p)=>s+p.d,0);
      c.poison.forEach(p=>p.n--);c.poison=c.poison.filter(p=>p.n>0);
      hit(null,c,sum,false,'poison');
    }
    if(c.alive&&c.regen) heal(c,c.maxHp*c.regen,false);
  }
}
function log(msg,cls=''){
  S.log.push({msg,cls});if(S.log.length>80) S.log.shift();
  const ul=$('#log'); if(!ul) return;
  if(ul.dataset.empty){ul.innerHTML='';delete ul.dataset.empty;}
  const li=document.createElement('li');li.className=cls;li.textContent=msg;ul.appendChild(li);
  while(ul.children.length>80) ul.firstChild.remove();
  ul.scrollTop=ul.scrollHeight;
}

function netConnect(addr){
  return new Promise((res,rej)=>{
    let ws;try{ws=new WebSocket('ws://'+addr+'/ws');}catch(e){rej(e);return;}
    const to=setTimeout(()=>{try{ws.close();}catch(_){}rej(new Error('timeout'));},5000);
    ws.onopen=()=>{clearTimeout(to);res(ws);};
    ws.onerror=()=>{clearTimeout(to);rej(new Error('fail'));};
  });
}
function netAddr(v){
  v=String(v||'').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(!v) return '';
  if(!/:\d+$/.test(v)) v+=':8777';
  return v;
}

/* ---------- онлайн: комнаты по коду (WebRTC, PeerJS) ---------- */
function roomCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<6;i++)r+=a[Math.floor(Math.random()*a.length)];return r;}
function onlineHost(tries=0){
  if((NET.ws||NET.peer)&&tries===0) return;
  if(typeof Peer==='undefined'){toast('Онлайн-модуль не загрузился. Проверьте интернет.','bad');return;}
  const name=readName(),code=roomCode();
  if(tries===0) toast('Создаём комнату…');
  const peer=new Peer(PEER_PREFIX+code,PEER_OPTS);
  NET.peer=peer;NET.tr='p2p';NET.isHost=true;NET.conns=new Map();NET.room=code;
  let nextId=2;
  peer.on('open',()=>{
    NET.id=1;
    HOST.players=[{id:1,name,bot:false,hp:START_HP,alive:true}];HOST.started=false;HOST.round=0;HOST.phase='lobby';HOST.botc=0;
    NET.view='lobby';S.showStart=false;hideShowcase();showShowcase();hostLobby();renderOverlay();
  });
  peer.on('connection',conn=>{
    const id=nextId++;
    conn.on('open',()=>{NET.conns.set(id,conn);p2pSend(conn,{t:'hello',id});});
    conn.on('data',d=>{if(d&&typeof d==='object'&&!Array.isArray(d)) hostHandle(id,d);});
    conn.on('close',()=>{if(NET.conns.delete(id)) hostHandle(id,{t:'leave'});});
    conn.on('error',()=>{});
  });
  peer.on('disconnected',()=>{if(NET.peer===peer&&!peer.destroyed){try{peer.reconnect();}catch(_){}}});
  peer.on('error',e=>{
    if(NET.peer!==peer) return;
    if(e.type==='unavailable-id'&&tries<3){try{peer.destroy();}catch(_){}NET.peer=null;onlineHost(tries+1);return;}
    if(NET.view!=='lobby'||!NET.id){toast('Не удалось создать комнату: нет связи с сервером знакомства. Проверьте интернет.','bad');netReset(false);}
  });
}
function onlineJoin(){
  if(NET.ws||NET.peer) return;
  if(typeof Peer==='undefined'){toast('Онлайн-модуль не загрузился. Проверьте интернет.','bad');return;}
  const el=$('#room'),code=String(el?el.value:'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6){toast('Введите код комнаты из 6 символов','bad');return;}
  const name=readName();
  toast('Подключаемся к комнате '+code+'…');
  const peer=new Peer(PEER_OPTS);
  NET.peer=peer;NET.tr='p2p';NET.isHost=false;NET.room=code;
  let to=setTimeout(()=>{if(NET.peer===peer&&!NET.id){toast('Не удалось подключиться к комнате. Проверьте код и что хост не закрыл игру.','bad');netReset(false);}},30000);
  // повторяем попытку: сервер знакомства иногда отвечает с задержкой
  let attempt=0;
  const tryConnect=()=>{
    attempt++;
    const conn=peer.connect(PEER_PREFIX+code,{reliable:true,serialization:'json'});
    NET.conn=conn;
    const retry=setTimeout(()=>{if(NET.conn===conn&&!NET.id&&attempt<4){try{conn.close();}catch(_){}tryConnect();}},6000);
    conn.on('open',()=>clearTimeout(retry));
    conn.on('data',m=>{
      if(!m||typeof m!=='object') return;
      if(m.t==='hello'&&!NET.id){clearTimeout(to);clearTimeout(retry);NET.id=m.id;p2pSend(conn,{t:'hello',name});NET.view='lobby';S.showStart=false;renderOverlay();}
      else clientHandle(m);
    });
    conn.on('close',()=>{if(NET.conn===conn&&NET.id){toast('Связь с хостом потеряна','bad');netReset(true);}});
    conn.on('error',()=>{});
  };
  peer.on('open',tryConnect);
  peer.on('disconnected',()=>{if(NET.peer===peer&&!peer.destroyed){try{peer.reconnect();}catch(_){}}});
  peer.on('error',e=>{
    if(NET.peer!==peer) return;
    if(NET.id) return;
    if(e.type==='peer-unavailable'&&attempt<3){setTimeout(()=>{if(NET.peer===peer&&!NET.id)tryConnect();},2000);return;}
    if(['network','server-error','socket-error','socket-closed'].includes(e.type)&&attempt<3) return;
    clearTimeout(to);
    toast(e.type==='peer-unavailable'?`Комната ${code} не найдена. Проверьте код.`:'Не удалось подключиться: нет связи с сервером знакомства. Проверьте интернет.','bad');
    netReset(false);
  });
}

/* ---------- данные из сети: только проверенные значения ---------- */
function cleanBoard(b){
  const out=Array(5).fill(null); if(!Array.isArray(b)) return out;
  for(let i=0;i<5;i++){
    const u=b[i]; if(!u||!DEF[u.id]) continue;
    const items=(Array.isArray(u.items)?u.items:[]).filter(k=>MAGIC[k]&&MAGIC[k].k==='item').slice(0,2);
    out[i]={id:u.id,star:Math.min(3,Math.max(1,u.star|0)),items};
  }
  return out;
}
function cleanSpells(a){
  return (Array.isArray(a)?a:[]).slice(0,2).filter(x=>x&&MAGIC[x.k]&&MAGIC[x.k].k==='spell')
    .map(x=>({k:x.k,caster:x.caster==='home'?'home':'away',tside:x.tside==='home'?'home':'away',lane:Math.min(4,Math.max(0,x.lane|0))}));
}
const snapOf=side=>({board:side.board.map(u=>u?{id:u.id,star:u.star,items:u.items||[]}:null),level:side.level});

const BOT_NAMES=['Бот Пиковый','Бот Червовый','Бот Бубновый','Бот Трефовый','Бот Джокер','Бот Туз','Бот Король'];

function hostStart(){

}
function hostHandle(from,m){
  if(!m||typeof m!=='object') return;
  const P=HOST.players.find(p=>p.id===from);
  switch(m.t){
    case 'hello':
      if(HOST.started){sendTo(from,{t:'refused',why:'Игра уже началась'});return;}
      if(HOST.players.length>=8){sendTo(from,{t:'refused',why:'В лобби уже 8 участников'});return;}
      if(!P) HOST.players.push({id:from,name:String(m.name||'Игрок').slice(0,18),bot:false,hp:START_HP,alive:true});
      hostLobby();break;
    case 'ready':
      if(!P||!HOST.started||HOST.phase!=='shop'||!P.alive||P.ready) return;
      P.ready=true;
      P.snap={board:cleanBoard(m.snap&&m.snap.board),level:Math.min(8,Math.max(1,(m.snap&&m.snap.level)|0))};
      P.level=P.snap.level;P.lastSnap=P.snap;
      hostLobby();hostCheckReady();break;
    case 'step':{
      const b=HOST.battles[m.bid]; if(!b||(b.a!==from&&b.b!==from)) return;
      sendTo(b.a===from?b.b:b.a,{t:'step',bid:m.bid,k:m.k|0,spells:cleanSpells(m.spells)});
      break;}
    case 'result':
      if(!P||!HOST.pending.has(from)) return;
      P.hp=Math.max(0,Math.min(START_HP,m.hp|0));
      if(m.botId!=null){
        const bp=HOST.players.find(p=>p.id===m.botId&&p.bot);
        if(bp){bp.hp=Math.max(0,bp.hp-Math.max(0,m.botDmg|0));botStreak(bp.side,!m.won);}
      }
      HOST.pending.delete(from);hostLobby();hostCheckDone();break;
    case 'leave':
      if(!P) return;
      if(!HOST.started){HOST.players=HOST.players.filter(p=>p!==P);}
      else{
        if(P.alive){P.alive=false;P.hp=0;P.place=HOST.players.filter(p=>p.alive).length+1;}
        HOST.pending.delete(from);
        for(const bid in HOST.battles){const b=HOST.battles[bid];if(b.a===from||b.b===from) sendTo(b.a===from?b.b:b.a,{t:'oppgone',bid:+bid});}
        hostCheckReady();hostCheckDone();
      }
      hostLobby();break;
  }
}
function botStreak(side,won){side.streak=won?(side.streak>0?side.streak+1:1):(side.streak<0?side.streak-1:-1);}
function hostStartRound(){
  HOST.round++;HOST.phase='shop';HOST.battles={};HOST.pending.clear();
  for(const p of HOST.players){p.ready=false;p.snap=null;if(p.bot&&p.alive) hostBotTurn(p);}
  hostLobby();
  broadcast({t:'round',round:HOST.round,secs:SHOP_SECS});
  clearTimeout(HOST.timer);HOST.timer=setTimeout(hostForceReady,(SHOP_SECS+6)*1000);
}
function hostBotTurn(p){
  const side=p.side,keepRound=S.round,keepDiff=S.diff;
  S.round=HOST.round;S.diff='normal';
  try{
    if(HOST.round===1) side.gold=6;
    else{const interest=Math.min(5,Math.floor(side.gold/10)),st=Math.abs(side.streak);side.gold+=5+interest+(st>=3?2:st>=2?1:0);addXp(side,2);}
    side.hand=[];
    aiTurn(side);
  } finally {S.round=keepRound;S.diff=keepDiff;}
  p.level=side.level;p.snap=snapOf(side);p.ready=true;
}
function hostForceReady(){
  if(!HOST.started||HOST.phase!=='shop') return;
  for(const p of HOST.players) if(p.alive&&!p.bot&&!p.ready){p.ready=true;p.snap=p.lastSnap||{board:Array(5).fill(null),level:1};}
  hostCheckReady();
}
function hostCheckReady(){
  if(HOST.started&&HOST.phase==='shop'&&HOST.players.filter(p=>p.alive&&!p.bot).every(p=>p.ready)) hostBattles();
}
function hostBattles(){
  clearTimeout(HOST.timer);HOST.phase='battle';
  const ps=HOST.players.filter(p=>p.alive).sort(()=>Math.random()-.5);
  const seed=()=>Math.floor(Math.random()*2147483647);
  const info=(p,ghost)=>({id:p.id,name:(ghost?'Призрак: ':'')+p.name,bot:p.bot&&!ghost,ghost:!!ghost,
    board:p.snap?p.snap.board:Array(5).fill(null),level:p.level||1,hand:p.bot&&!ghost?p.side.hand.filter(k=>MAGIC[k].k==='spell'):[]});
  const send=(p,opp,bid,sd,home,live)=>{HOST.pending.add(p.id);sendTo(p.id,{t:'battle',bid,seed:sd,home,live,opp});};
  for(let i=0;i+1<ps.length;i+=2){
    const a=ps[i],b=ps[i+1],bid=HOST.bidc++,sd=seed();
    if(!a.bot&&!b.bot){HOST.battles[bid]={a:a.id,b:b.id};send(a,info(b),bid,sd,true,true);send(b,info(a),bid,sd,false,true);}
    else if(a.bot&&b.bot) hostBotFight(a,b,false);
    else{const h=a.bot?b:a,bt=a.bot?a:b;send(h,info(bt),bid,sd,true,false);}
  }
  if(ps.length%2){
    const odd=ps[ps.length-1],others=ps.filter(p=>p!==odd),g=others[Math.floor(Math.random()*others.length)];
    if(!odd.bot) send(odd,info(g,true),HOST.bidc++,seed(),true,false);
    else hostBotFight(odd,g,true);
  }
  hostLobby();hostCheckDone();
}
// бой бот против бота считается быстро, без анимации
function hostBotFight(a,b,ghost){
  const units=p=>(p.snap?p.snap.board:[]).filter(Boolean);
  const sc=p=>{const us=units(p),H=HANDS[teamInfo(us).hand];return us.reduce((s,u)=>s+power(u),0)*(1+(H.atk+H.hp)/2)*(.75+Math.random()*.5);};
  const base=1+Math.floor(HOST.round/3),dmg=w=>base+Math.max(1,Math.round(units(w).length*.8));
  const aw=sc(a)>=sc(b);
  if(aw){botStreak(a.side,true);if(!ghost){b.hp=Math.max(0,b.hp-dmg(a));botStreak(b.side,false);}}
  else{a.hp=Math.max(0,a.hp-dmg(b));botStreak(a.side,false);if(!ghost)botStreak(b.side,true);}
}
function hostCheckDone(){
  if(!HOST.started||HOST.phase!=='battle'||HOST.pending.size) return;
  HOST.phase='done';
  const alive=HOST.players.filter(p=>p.alive);
  const dying=alive.filter(p=>p.hp<=0);
  const remain=alive.length-dying.length;
  dying.forEach(p=>{p.alive=false;p.place=Math.max(1,remain+1);});
  if(remain<=1){
    const w=HOST.players.find(p=>p.alive);if(w)w.place=1;
    HOST.started=false;HOST.phase='over';hostLobby();broadcast({t:'over'});return;
  }
  hostLobby();
  clearTimeout(HOST.timer);HOST.timer=setTimeout(hostStartRound,4000);
}

/* ---------- клиент (каждый игрок, включая хоста) ---------- */
function clientHandle(m){
  if(!m||typeof m!=='object') return;
  switch(m.t){
    case 'lobby':
      NET.players=Array.isArray(m.players)?m.players:[];NET.started=!!m.started;NET.hostId=m.host;
      if(NET.view==='lobby') renderOverlay();
      else if(S&&S.mode==='net'){renderTop();renderSide();if(S.phase==='wait')renderShopbar();}
      break;
    case 'refused': toast(m.why||'Подключение отклонено','bad');netReset(true);break;
    case 'round': netRound(m);break;
    case 'battle': netBattle(m);break;
    case 'step':
      if(m.bid===NET.bid){NET.inbox[m.k]=cleanSpells(m.spells);const w=NET.waiters[m.k];if(w){delete NET.waiters[m.k];w(NET.inbox[m.k]);}}
      break;
    case 'oppgone':
      if(m.bid===NET.bid){NET.oppGone=true;Object.values(NET.waiters).forEach(f=>f([]));NET.waiters={};toast('Соперник отключился, бой досчитывается без него','bad');}
      break;
    case 'over': netOver();break;
  }
}
function netRound(m){
  const me=NET.players.find(p=>p.id===NET.id);
  if(me&&!me.alive) return;
  NET.view=null;
  if(m.round===1||!S||S.mode!=='net'){hideShowcase();newGame('normal',false,true);}
  else{S.round=m.round;S.peek=false;beginRound(false);}
  S.deadline=Date.now()+(m.secs|0)*1000;
  clearInterval(NET.timer);NET.timer=setInterval(netTick,250);netTick();
}
function netTick(){
  if(!S||S.mode!=='net'||S.phase!=='shop') return;
  const rem=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));
  const b=$('#fightbtn');if(b) b.textContent=`Готов · 0:${String(rem).padStart(2,'0')}`;
  if(rem<=0) netReady();
}
function netReady(){
  if(!S||S.phase!=='shop') return;
  S.phase='wait';S.sel=null;S.useMagic=null;dragging=null;
  sendHost({t:'ready',snap:snapOf(S.p)});
  sfx('place');render();
}
async function netBattle(m){
  if(!S||S.mode!=='net') return;
  if(S.phase==='shop') netReady();
  const o=m.opp||{};
  S.ai=newSide();S.ai.level=(o.level|0)||1;
  S.ai.board=cleanBoard(o.board).map(u=>u?{uid:uidc++,id:u.id,star:u.star,items:u.items}:null);
  S.ai.hand=(Array.isArray(o.hand)?o.hand:[]).filter(k=>MAGIC[k]&&MAGIC[k].k==='spell').slice(0,2);
  const pl=NET.players.find(p=>p.id===o.id);S.ai.hp=pl?pl.hp:START_HP;
  S.opp={id:o.id,name:String(o.name||'Соперник').slice(0,30),bot:!!o.bot,ghost:!!o.ghost};
  NET.bid=m.bid;NET.live=!!m.live;NET.inbox={};NET.waiters={};NET.oppGone=false;
  S.home=!!m.home;S.rng=mulberry32(m.seed|0);S.pendingSpells=[];S.queued=[];
  S.phase='battle';S.sel=null;S.log=[];S.peek=false;
  if(document.hidden) S.speed=99;
  sfx('start');
  const res=await simulate();
  resolve(res);
}
async function netSync(k){
  const mine=(S.pendingSpells||[]).splice(0);
  let theirs=[];
  if(NET.live&&!NET.oppGone){sendHost({t:'step',bid:NET.bid,k,spells:mine});theirs=await netWait(k);}
  S.queued=S.home?[...mine,...theirs]:[...theirs,...mine];
}
function netWait(k){
  if(NET.inbox[k]) return Promise.resolve(NET.inbox[k]);
  return new Promise(res=>{
    let done=false;
    const fin=v=>{if(done)return;done=true;clearTimeout(t1);clearTimeout(t2);const el=$('#stepc');if(el&&S.phase==='battle')el.textContent=`Ход ${S.step}`;res(v||[]);};
    NET.waiters[k]=fin;
    const t1=setTimeout(()=>{const el=$('#stepc');if(el)el.textContent='Ждём соперника…';},400);
    const t2=setTimeout(()=>{delete NET.waiters[k];NET.oppGone=true;toast('Соперник не отвечает, бой досчитывается без него','bad');fin([]);},120000);
  });
}
async function applyQueued(){
  const q=S.queued||[];S.queued=[];
  for(const sp of q){
    const side=(sp.caster==='home')===S.home?'p':'e',tside=(sp.tside==='home')===S.home?'p':'e';
    const t=MAGIC[sp.k].t?S.teams[tside][sp.lane]:null;
    if(MAGIC[sp.k].t&&!t) continue;
    await castSpell(side,sp.k,t);
  }
}
function netOver(){
  if(!S) return;
  S.netOver=true;clearInterval(NET.timer);
  const me=NET.players.find(p=>p.id===NET.id);
  sfx(me&&me.place===1?'win':'lose');
  render();
}

/* ---------- запуск ---------- */
frameCamera();
if(location.hash.startsWith('#demo')){
  // демо-расклад для проверки: готовое поле у обеих сторон
  newGame('normal');
  S.round=6;S.p.level=4;S.ai.level=4;S.p.gold=24;
  S.p.board=[mkUnit('fox',2),mkUnit('golem'),mkUnit('bear'),mkUnit('witch'),mkUnit('pirate')];
  S.p.board[0].items=['sword'];S.p.board[1].items=['armor','joker'];
  S.p.hand=['fireball','bless','feather'];S.ai.hand=['freeze'];
  S.p.bench=[mkUnit('cat'),mkUnit('owl'),null,mkUnit('peng',2),null,null];
  S.ai.board=[mkUnit('dog',2),mkUnit('ninja'),mkUnit('frog'),mkUnit('snail'),mkUnit('chili')];
  S.info={id:'fox',star:2};
  render();
  if(location.hash==='#demofight') setTimeout(()=>{S.ai.gold=0;const keep=aiTurn;aiTurn=()=>{};fight().then(()=>{aiTurn=keep;});
    setTimeout(()=>{onMagic(1);onMagic(0);const c=live(S.teams.e)[0];if(c)playSpell(0,c);},3200);},1500);
} else {
  newGame('normal',true);
  showShowcase();
  render();
}
