name: Pages

# Браузерная версия игры на GitHub Pages (одиночная игра и онлайн по коду комнаты).
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка сайта
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site
          # Godot-версия (2.x) из последнего релиза; классическая браузерная версия — в /classic/
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-Web.zip' --dir dl 2>/dev/null; then
            unzip -q dl/*-Web.zip -d site
            mkdir -p site/classic
            cp -r web/. site/classic/
          else
            cp -r web/. site/
          fi
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
